<div>
  <input #postIdInput
         [value]="editPostId()"
         (input)="postIdInput.value"
         [placeholder]="editPostId() || 'ID du post à éditer'"
         size="15"
         type="number" />

  <a
    [routerLink]="canNavigate(postIdInput.value) ? ['/home/edit', editPostId() || postIdInput.value] : null"
    [style.pointer-events]="canNavigate(postIdInput.value) ? 'auto' : 'none'"
    [style.color]="canNavigate(postIdInput.value) ? 'blue' : 'gray'">
    edit
  </a>
</div>

<section>
  <div>
    <textarea type="text" [(ngModel)]="url_post" [disabled]="selectedOption!=='generate'"
           placeholder="mettre le lien URL de l article ici." size="50" style="
    padding: 20px;
    font-size: 15px;
    width: 100%;"></textarea>
  </div>
  <div>
    <button (click)="process()" [disabled]="isLoading()" style="
    padding: 20px;
    width: 100%;
    font-size: 22px;
    margin: 20px 0 0 0;
    background-color: aliceblue;">Clicker ici pour faire le résumé de l 'article.
    </button>
  </div>
  <div style="margin: 20px 0;">
    <mat-radio-group aria-label="Sélectionnez une option" [(ngModel)]="selectedOption"
                     (ngModelChange)="onOptionChange()">
      <mat-radio-button value="all">article et/ou idée</mat-radio-button>
      <mat-radio-button value="article">Recherche juste dans les Articles</mat-radio-button>
      <mat-radio-button value="generate" style="margin-left: 20px;">Générer un article</mat-radio-button>
    </mat-radio-group>
  </div>
</section>

<div *ngFor="let msg of messages()" [ngClass]="'message-' + msg.type" style="margin: 5px 0;">
  {{ msg.type }} - {{ msg.content }}
</div>
